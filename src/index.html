<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PortfolioMaker</title>
  <base href="/">

  <!-- Preconnect para Google Fonts (reduz latência de DNS + TLS) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Carrega Roboto com display=swap para não bloquear renderização do texto (LCP) -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">

  <!-- Preconnect para o CDN do vanilla-tilt -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
</head>
<body>
  <app-root></app-root>
  <!-- defer: script não bloqueia o parsing/renderização da página (LCP) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.2/vanilla-tilt.min.js" defer></script>

</body>
</html>
